name: BODYFORGE verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-build-synthetic:
    name: Unit, artifact and synthetic browser checks
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out the event revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: '24.18.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify the pinned build and browser behavior
        run: node qa/release-gates.mjs --commit "$env:GITHUB_SHA"
